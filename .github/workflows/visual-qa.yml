name: Visual QA

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install isolated browser tooling
        run: |
          npm install --prefix .qa --no-save --package-lock=false playwright@1.55.0
          node .qa/node_modules/playwright/cli.js install --with-deps chromium

      - name: Capture public-page screenshots
        run: npm run qa:visual

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opus-visual-qa-${{ github.run_id }}
          path: .qa/visual/
          if-no-files-found: warn
          retention-days: 14
