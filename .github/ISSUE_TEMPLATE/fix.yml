name: 🔧 버그 수정
description: 확인된 버그의 수정 작업과 완료 조건을 기록합니다.
title: '[Fix] 🔧 '
labels:
  - '🔧 fix'

body:
  - type: textarea
    id: summary
    attributes:
      label: 수정할 문제
      description: 수정이 필요한 문제와 서비스에 미치는 영향을 작성해주세요.
      placeholder: |
        대회 공지사항 상세에서 대회 화면으로 돌아가는 링크가 표시되지 않습니다.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 재현 및 기대 동작
      description: 문제를 재현하는 방법과 수정 후 기대하는 동작을 작성해주세요.
      placeholder: |
        재현 절차:
        1. 대회 화면에서 공지사항을 선택합니다.
        2. 상세 화면에서 대회로 돌아가는 링크를 확인합니다.

        기대 동작:
        대회 화면으로 돌아가는 링크가 표시되고 정상적으로 이동합니다.

  - type: textarea
    id: solution
    attributes:
      label: 수정 방향
      description: 예상 원인과 수정할 내용을 작성해주세요.
      placeholder: |
        - 원인:
        - 수정할 내용:
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건
      description: 수정 완료를 판단할 수 있는 기준을 작성해주세요.
      placeholder: |
        - [ ] 재현 절차에서 문제가 더 이상 발생하지 않습니다.
        - [ ] 기존 기능에 회귀가 없습니다.
        - [ ] 관련 테스트 또는 QA를 완료했습니다.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 버그 이슈, 로그, 이미지 등의 링크를 작성해주세요.
      placeholder: |
        - 관련 이슈:
        - 증빙 자료:
